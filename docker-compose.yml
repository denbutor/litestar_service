services:
  litestar:
    build: .
    container_name: litestar_service
    env_file: .env
    depends_on:
      - db
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: granian --interface asgi --host 0.0.0.0 --port 5000 app.main:app

  db:
    image: postgres:15
    container_name: litestar_service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: litestar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
